name: Backend CI

on:
  push:
    branches:
      - dev
      - testing
      - 'test/**'
      - 'refactor/**'
    paths:
      - 'Lobby/**'
      - 'Lobby.Application/**'
      - 'Lobby.Infrastructure/**'
      - 'Lobby.Tests/**'
      - 'LobbyUnityShared/**'
      - 'Terraria.slnx'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - dev
      - testing
    paths:
      - 'Lobby/**'
      - 'Lobby.Application/**'
      - 'Lobby.Infrastructure/**'
      - 'Lobby.Tests/**'
      - 'LobbyUnityShared/**'
      - 'Terraria.slnx'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-tests:
    name: Build & test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Terraria.slnx

      - name: Build
        run: dotnet build Terraria.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Terraria.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults
          if-no-files-found: ignore
